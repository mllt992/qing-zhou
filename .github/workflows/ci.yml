name: ci

# Runs on every push and PR. The race detector is the point: it needs cgo, which
# is unavailable on the maintainer's Windows machine, so concurrency bugs in the
# stats/rebuild goroutines could previously only be found by reading the code.
# Here they get caught automatically.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # The Go build embeds frontend/dist, which is not committed. A minimal
      # placeholder keeps `go build` honest without paying for a full npm install
      # on every push; the release workflow builds the real frontend.
      - name: Placeholder frontend assets
        run: |
          mkdir -p frontend/dist
          [ -f frontend/dist/index.html ] || echo '<!doctype html><title>ci</title>' > frontend/dist/index.html

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race ./...

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Both scripts are piped into `bash` as root — install.sh on the panel
      # host, install-singbox.sh on every landing node. A syntax error in either
      # is a broken machine, so at minimum they must parse.
      - name: Parse install scripts
        run: |
          bash -n internal/assets/install-singbox.sh
          bash -n install.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: frontend
        # Keep the same type and network checks required before a release.
        run: npm ci
      - name: Test frontend (unit + accessibility)
        working-directory: frontend
        run: npm test
      - name: Production frontend build (typecheck + bundle)
        working-directory: frontend
        run: npm run build

  relay-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Fetch pinned metering-enabled sing-box fixture
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/qz-sing-box" \
            https://github.com/mllt992/qing-zhou/releases/download/v0.2.86/sing-box-linux-amd64
          echo "68472358c9e43a50417beadb6d3ae9207417fdebb296286605dabd71da25a7da  $RUNNER_TEMP/qz-sing-box" | sha256sum --check --strict
          chmod 700 "$RUNNER_TEMP/qz-sing-box"
          "$RUNNER_TEMP/qz-sing-box" version | grep -q with_v2ray_api
      - name: Relay observation and single quota debit over loopback
        env:
          QZ_SINGBOX_TEST_BIN: ${{ runner.temp }}/qz-sing-box
          QZ_SINGBOX_REQUIRE_STATS: "1"
        run: go test -race ./internal/store -run '^TestMeteringRelayRealSingboxTraffic$' -count=1 -v
