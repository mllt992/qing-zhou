name: release

# Attach prebuilt binaries to a GitHub Release.
#
# Workflow: author the release in the GitHub UI (write the changelog in the
# body, pick the tag, publish) — this job then builds the panel + probe for
# each arch, injects the tag as the binary version, and uploads them as release
# assets. GitHub computes each asset's sha256 digest automatically, which the
# in-panel updater verifies before installing.
#
# The panel's "在线更新" page reads the latest release via the GitHub API, so
# the version baked in here must match the release tag for the comparison to
# work — that is exactly what -X ...version.Version=<tag> guarantees.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build and upload assets for (e.g. v0.2.2)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_dispatch can rebuild an older tag. Fetch its commit so the
          # assets cannot be built from the workflow's current branch by mistake.
          fetch-depth: 0

      - name: Resolve tag
        id: ver
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$RELEASE_TAG"
          fi
          REVISION="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          git checkout --detach "$REVISION"
          echo "Building version $TAG from $REVISION"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend (embedded into the panel binary)
        working-directory: frontend
        run: |
          npm ci
          npx vite build

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # Release signing. The sha256 digest GitHub publishes only proves an asset
      # downloaded intact — it comes from the same API response as the download
      # URL, so it says nothing about who produced the bytes. Without a
      # signature, anyone who can publish a release here can ship arbitrary code
      # to every panel, which replaces its own binary and re-execs.
      #
      # Set up once: `go run ./tools/sign -genkey`, put the private key in the
      # repo secret RELEASE_SIGNING_KEY and the public key in RELEASE_PUBLIC_KEY.
      # With no secret configured (a fork, or before setup) this step is skipped
      # and the build behaves exactly as it did before signing existed.
      - name: Resolve signing key
        id: sign
        env:
          PUBKEY: ${{ secrets.RELEASE_PUBLIC_KEY }}
        run: |
          if [ -n "$PUBKEY" ]; then
            echo "pubkey=$PUBKEY" >> "$GITHUB_OUTPUT"
            echo "Release signing enabled"
          else
            echo "pubkey=" >> "$GITHUB_OUTPUT"
            echo "::warning::RELEASE_PUBLIC_KEY is not set — assets will be unsigned and panels will not verify authorship"
          fi

      - name: Build panel + probe (linux amd64/arm64)
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          PUBKEY: ${{ steps.sign.outputs.pubkey }}
        run: |
          set -e
          mkdir -p out
          LDFLAGS="-s -w -X qingzhou/internal/version.Version=${TAG}"
          if [ -n "$PUBKEY" ]; then
            LDFLAGS="$LDFLAGS -X qingzhou/internal/updater.ReleasePublicKey=${PUBKEY}"
          fi
          for arch in amd64 arm64; do
            echo "== panel linux/$arch =="
            GOOS=linux GOARCH=$arch go build -ldflags "$LDFLAGS" -o "out/qingzhou-linux-$arch" .
            echo "== probe linux/$arch =="
            GOOS=linux GOARCH=$arch go build -ldflags "-s -w -X qingzhou/internal/version.Version=${TAG}" -o "out/probe-linux-$arch" ./cmd/probe
          done
          ls -lh out

      # Sign AFTER building: the signature covers the exact bytes uploaded.
      - name: Sign panel binaries
        if: steps.sign.outputs.pubkey != ''
        env:
          QZ_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -e
          if [ -z "$QZ_SIGNING_KEY" ]; then
            echo "RELEASE_PUBLIC_KEY is set but RELEASE_SIGNING_KEY is not — panels built here would" >&2
            echo "require a signature that this job cannot produce, bricking in-panel updates." >&2
            exit 1
          fi
          go run ./tools/sign out/qingzhou-linux-amd64 out/qingzhou-linux-arm64
          ls -l out/*.sig

      # sing-box, built WITH the v2ray_api plugin.
      #
      # This has to be built rather than downloaded: official sing-box releases
      # do not include with_v2ray_api ("V2Ray API is not included by default" —
      # upstream build-from-source docs), and that plugin is the only way the
      # panel can read per-user traffic off a node. Installing an official
      # release therefore produces a node whose traffic is never metered and
      # whose quotas are never enforced, silently — the panel just shows zero.
      #
      # The tag list follows official 1.14.x DEFAULT_BUILD_TAGS for linux, plus
      # with_v2ray_api and with_grpc (needed for StatsService), and with_purego
      # so NaiveProxy outbound works on amd64/arm64 without CGO. New 1.14
      # defaults (cloudflared / usbip / openvpn / openconnect) are included so
      # a node reinstall does not silently lose protocol support relative to
      # upstream's own linux build.
      #
      # SB_VERSION is pinned so a release is reproducible, which means it only
      # moves when someone moves it — and this binary is what every node ends up
      # running, so a stale pin quietly holds every landing machine back. Re-check
      # against the current 1.14.x stable at each release.
      - name: Build sing-box with v2ray_api
        env:
          SB_VERSION: v1.14.0
        run: |
          set -e
          git clone --depth 1 --branch "$SB_VERSION" https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          TAGS="with_gvisor,with_quic,with_grpc,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_v2ray_api,with_tailscale,with_ccm,with_ocm,with_cloudflared,with_naive_outbound,with_usbip,with_openvpn,with_openconnect,with_purego,badlinkname,tfogo_checklinkname0"
          for arch in amd64 arm64; do
            echo "== sing-box linux/$arch =="
            # -checklinkname=0 is required: sing-box's badtls reaches into
            # crypto/tls internals via //go:linkname, which the linker rejects by
            # default on current Go ("invalid reference to
            # crypto/tls.(*Conn).handlePostHandshakeMessage").
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -tags "$TAGS" \
              -ldflags "-s -w -checklinkname=0 -X github.com/sagernet/sing-box/constant.Version=${SB_VERSION#v}" \
              -o "$GITHUB_WORKSPACE/out/sing-box-linux-$arch" ./cmd/sing-box
          done
          cd "$GITHUB_WORKSPACE"
          # Fail the release rather than ship a binary that silently can't meter.
          ./out/sing-box-linux-amd64 version | tee /dev/stderr | grep -q with_v2ray_api \
            || { echo "::error::built sing-box lacks with_v2ray_api"; exit 1; }

      - name: Checksums
        run: (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            out/qingzhou-linux-amd64
            out/qingzhou-linux-arm64
            out/qingzhou-linux-*.sig
            out/probe-linux-amd64
            out/probe-linux-arm64
            out/sing-box-linux-amd64
            out/sing-box-linux-arm64
            out/SHA256SUMS.txt
